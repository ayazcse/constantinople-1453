<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Constantinople 1453 — A Data-Driven Analysis</title>

    <meta
      name="description"
      content="A data analytics investigation of the 1453 conquest of Constantinople and the city's transformation into Istanbul, built on a sourced, cleaned, and validated historical dataset."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>"
    />
  </head>

  <body>

    <div id="root"></div>

    <!-- Background Audio -->
    <audio id="backgroundAudio" loop preload="auto">
      <source src="mehmed-theme.mp3" type="audio/mpeg" />
    </audio>

    <script>
      const audio = document.getElementById("backgroundAudio");

      audio.volume = 0.18;

      // Try autoplay
      audio.play().catch(() => {
        // Browser blocked autoplay.
        // Start audio after first user interaction.
        const startAudio = () => {
          audio.play().catch(() => {});
          document.removeEventListener("click", startAudio);
          document.removeEventListener("touchstart", startAudio);
          document.removeEventListener("keydown", startAudio);
        };

        document.addEventListener("click", startAudio);
        document.addEventListener("touchstart", startAudio);
        document.addEventListener("keydown", startAudio);
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
